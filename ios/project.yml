name: NiKAudio
options:
  bundleIdPrefix: com.nikvn2105
  deploymentTarget:
    iOS: "16.0"
targets:
  NiKAudio:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../assets/fonts
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.nikvn2105.nikaudio
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: NiKAudio
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UIAppFonts:
          - BeVietnamPro-Regular.ttf
          - BeVietnamPro-Bold.ttf
        UIBackgroundModes:
          - audio
        NSLocalNetworkUsageDescription: "NiKAudio cần truy cập mạng nội bộ để phát âm thanh và truyền tệp với PC."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
