name: Build NiKAudio (Windows + iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile NiKAudioPC.exe
        run: |
          rc /nologo /I . /fo NiKAudioFonts.res pc\fonts.rc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /O2 /EHsc /std:c++17 /MT /W3 /utf-8 pc\main.cpp NiKAudioFonts.res /Fe:NiKAudioPC.exe ws2_32.lib iphlpapi.lib ole32.lib uuid.lib winmm.lib avrt.lib

      - name: Verify LAN protocol vectors
        run: |
          cl /nologo /O2 /EHsc /std:c++17 /MT /W3 tests\lan_crypto.cpp /Fe:NiKAudioLanTest.exe bcrypt.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\NiKAudioLanTest.exe

      - name: Verify stereo downmix and limiter
        run: |
          cl /nologo /O2 /EHsc /std:c++17 /MT /W3 tests\stereo_mix.cpp /Fe:NiKAudioStereoTest.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\NiKAudioStereoTest.exe

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: NiKAudio-Windows
          path: NiKAudioPC.exe

  build-ios:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4

      - name: Verify audio recovery logic
        run: |
          swiftc -O -swift-version 5 ios/Sources/AudioRingBuffer.swift ios/Sources/LANSession.swift tests/audio_core.swift -o "$RUNNER_TEMP/nikaudio-audio-tests"
          "$RUNNER_TEMP/nikaudio-audio-tests"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: ios
        run: xcodegen generate

      - name: Build Unsigned iOS App
        working-directory: ios
        run: |
          xcodebuild \
            -project NiKAudio.xcodeproj \
            -scheme NiKAudio \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            build

      - name: Package Unsigned IPA
        run: |
          mkdir -p dist/Payload
          cp -r ios/build/Build/Products/Release-iphoneos/NiKAudio.app dist/Payload/
          cd dist && zip -r ../NiKAudio.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: NiKAudio-iOS-IPA
          path: NiKAudio.ipa
